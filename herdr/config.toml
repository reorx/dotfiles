onboarding = false
# ref: https://herdr.dev/docs/config-reference/

[theme]
name = "catppuccin"
auto_switch = false
# ref: https://github.com/herdrdev/herdr/blob/master/src/app/state.rs
custom.panel_bg = "rgb(24, 24, 37)"
custom.sidebar_bg = "reset"
custom.active_row_bg = "rgb(48, 48, 70)"
custom.selection_bg = "rgb(49, 50, 68)"
custom.surface0 = "rgb(49, 50, 68)"
custom.surface1 = "rgb(69, 71, 90)"
custom.surface_dim = "rgb(30, 30, 46)"
custom.overlay0 = "rgb(182, 190, 242)"
custom.overlay1 = "rgb(127, 132, 156)"
custom.text = "rgb(205, 214, 244)"
custom.subtext0 = "rgb(166, 173, 200)"
custom.mauve = "rgb(203, 166, 247)"
custom.green = "rgb(166, 227, 161)"
custom.yellow = "rgb(249, 226, 175)"
custom.red = "rgb(243, 139, 168)"
custom.blue = "rgb(137, 180, 250)"
custom.teal = "rgb(148, 226, 213)"
custom.peach = "rgb(250, 179, 135)"

[ui]
show_agent_labels_on_pane_borders = true
#sidebar.spaces.rows = [["state_icon", "workspace"], ["branch", "git_status"]]
sidebar.spaces.rows = [["state_icon", "workspace", "git_status"]]
#sidebar.agents.rows = [["state_icon", "workspace", "tab"], ["agent"]]
sidebar.agents.rows = [["state_icon", "workspace", "tab"]]
accent = "#ec4899"

agent_panel_sort = "spaces"
[keys]
prefix = "ctrl+a"
detach = "prefix+d"

# workspace
next_workspace = ["ctrl+.", "prefix+shift+j"]
previous_workspace = ["ctrl+,", "prefix+shift+k"]
switch_workspace = "prefix+1..9"
close_workspace = "prefix+shift+x"

# tab
next_tab = ["ctrl+right", "prefix+n"]
previous_tab = ["ctrl+left", "prefix+p"]
rename_tab = "prefix+r"
#switch_tab = "ctrl+1..9"

# pane
cycle_pane_next = "shift+right"
cycle_pane_previous = "shift+left"
split_vertical =  "prefix+|"
zoom = "prefix+m"

# agent
next_agent = ["prefix+;"]
previous_agent = ["prefix+'"]

# worktree
remove_worktree = "prefix+shift+d"

[[keys.command]]
key = "prefix+l"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+i"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "navigate_line.jump_start"
description = "send ctrl+a to pane"

[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "navigate_line.create_workspace"
description = "create workspace from directory prompt"

[[keys.command]]
key = "ctrl+;"
type = "plugin_action"
command = "navigate_line.next_unread_agent"
description = "focus next unread/blocked agent"

[[keys.command]]
key = "ctrl+'"
type = "plugin_action"
command = "navigate_line.pick_agent"
description = "pick agent from filterable list"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "navigate_line.new_tab_quick"
description = "create tab named by ordinal"

[[keys.command]]
key = "prefix+shift+t"
type = "plugin_action"
command = "navigate_line.new_tab_adjacent"
description = "create tab next to current"

[[keys.command]]
key = "prefix+/"
type = "plugin_action"
command = "navigate_line.break_pane"
description = "break pane into new tab"
