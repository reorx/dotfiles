id = "kit"
name = "Kit"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Personal Herdr toolkit: readline key forwarding, pane/tab helpers, agent navigation, and a workspace get-or-create picker"
platforms = ["linux", "macos"]

[[actions]]
id = "jump_start"
title = "Line: jump to start (ctrl+a)"
command = ["sh", "send-keys.sh", "ctrl+a"]

[[actions]]
id = "jump_end"
title = "Line: jump to end (ctrl+e)"
command = ["sh", "send-keys.sh", "ctrl+e"]

[[actions]]
id = "word_back"
title = "Line: word back (alt+b)"
command = ["sh", "send-keys.sh", "alt+b"]

[[actions]]
id = "word_forward"
title = "Line: word forward (alt+f)"
command = ["sh", "send-keys.sh", "alt+f"]

[[actions]]
id = "break_pane"
title = "Pane: break into new tab"
description = "Move the focused pane into a new tab"
contexts = ["pane"]
command = ["sh", "break-pane.sh"]

[[actions]]
id = "pick_split"
title = "Pane: split with layout picker"
description = "Open a popup that splits the focused pane in two key presses, no enter: the side of the new pane (1-4: top, right, bottom, left), then its size (1-3: 25%, 50%, 75%, or space for 50%); each step previews its choices"
contexts = ["pane"]
command = ["sh", "open-split-picker.sh"]

[[actions]]
id = "new_tab_quick"
title = "Tab: create with ordinal name"
description = "Create a tab in the current workspace without a name prompt; the label is the auto ordinal that follows the tab position"
command = ["sh", "new-tab-quick.sh"]

[[actions]]
id = "new_tab_adjacent"
title = "Tab: create next to current"
description = "Create a tab right after the current one (instead of at the end) and focus it; the label is the auto ordinal"
command = ["python3", "new-tab-adjacent.py"]

[[actions]]
id = "next_unread_agent"
title = "Agent: focus next unread/blocked"
description = "Focus the next agent that is done (finished, unread) or blocked (waiting for a reply); working and idle agents are skipped"
command = ["python3", "next-unread-agent.py"]

[[actions]]
id = "pick_agent"
title = "Agent: pick from list"
description = "Open a popup listing every agent as title + status; filter by typing, focus the selection on enter"
command = ["sh", "open-agent-picker.sh"]

[[actions]]
id = "pick_workspace"
title = "Workspace: pick or open from ~/Code"
description = "Open a popup listing every workspace, then the ~/Code directories without one; filter by typing, enter focuses the workspace or creates one for the directory"
command = ["sh", "open-workspace-picker.sh"]

[[actions]]
id = "create_workspace"
title = "Workspace: create from directory prompt"
command = ["sh", "open-create-workspace.sh"]

[[panes]]
id = "agent_picker"
title = "Agents"
placement = "popup"
command = ["sh", "agent-picker.sh"]

[[panes]]
id = "workspace_picker"
title = "Workspaces"
placement = "popup"
command = ["python3", "workspace-picker.py"]

[[panes]]
id = "create_workspace_prompt"
title = "Create workspace"
placement = "popup"
command = ["sh", "create-workspace.sh"]

[[panes]]
id = "split_picker"
title = "New pane"
placement = "popup"
width = 85
height = 16
command = ["python3", "split-picker.py"]
