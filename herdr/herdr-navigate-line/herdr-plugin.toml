id = "navigate_line"
name = "Navigate Line"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Send readline cursor-movement keys to the focused pane, so prefix keys like ctrl+a can be forwarded to the shell"
platforms = ["linux", "macos"]

[[actions]]
id = "jump_start"
title = "Line: jump to start (ctrl+a)"
command = ["sh", "send-keys.sh", "ctrl+a"]

[[actions]]
id = "jump_end"
title = "Line: jump to end (ctrl+e)"
command = ["sh", "send-keys.sh", "ctrl+e"]

[[actions]]
id = "word_back"
title = "Line: word back (alt+b)"
command = ["sh", "send-keys.sh", "alt+b"]

[[actions]]
id = "word_forward"
title = "Line: word forward (alt+f)"
command = ["sh", "send-keys.sh", "alt+f"]

[[actions]]
id = "break_pane"
title = "Pane: break into new tab"
description = "Move the focused pane into a new tab"
contexts = ["pane"]
command = ["sh", "break-pane.sh"]

[[actions]]
id = "new_tab_quick"
title = "Tab: create with ordinal name"
description = "Create a tab in the current workspace without a name prompt; the label defaults to the tab ordinal"
command = ["sh", "new-tab-quick.sh"]

[[actions]]
id = "next_unread_agent"
title = "Agent: focus next unread/blocked"
description = "Focus the next agent that is done (finished, unread) or blocked (waiting for a reply); working and idle agents are skipped"
command = ["python3", "next-unread-agent.py"]

[[actions]]
id = "pick_agent"
title = "Agent: pick from list"
description = "Open a popup listing every agent as title + status; filter by typing, focus the selection on enter"
command = ["sh", "open-agent-picker.sh"]

[[actions]]
id = "create_workspace"
title = "Workspace: create from directory prompt"
command = ["sh", "open-create-workspace.sh"]

[[panes]]
id = "agent_picker"
title = "Agents"
placement = "popup"
command = ["sh", "agent-picker.sh"]

[[panes]]
id = "create_workspace_prompt"
title = "Create workspace"
placement = "popup"
command = ["sh", "create-workspace.sh"]
